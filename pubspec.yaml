name: fresh_base_project
description: "Reusable Flutter base project without hardcoded environment values."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.3
  dartz: ^0.10.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  intl: ^0.20.2
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.2
  collection: ^1.18.0
  dio: ^5.4.0
  get_it: ^8.0.3
  go_router: ^17.2.3
  injectable: ^2.5.1
  retrofit: ^4.9.2
  crypto: ^3.0.6
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  logging: ^1.1.1
  uuid: ^4.1.0
  alice: ^1.0.0
  alice_dio: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  melos: ^6.3.2
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.10.0
  injectable_generator: ^2.6.2
  json_serializable: ^6.9.0
  retrofit_generator: ^10.2.6

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - env/

flutter_gen:
  output: lib/core/gen/
  line_length: 80
